<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>청소 생활 앱 프로토타입</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" role="application" aria-label="청소 생활 앱">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="24" height="24">
              <path d="M16 4c6.7 0 12 5.3 12 12s-5.3 12-12 12S4 22.7 4 16 9.3 4 16 4Z" fill="currentColor" opacity=".18" />
              <path d="M10 16.4 14.1 20 22 11.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div>
            <div class="brand-title">클린루프</div>
            <div class="brand-sub">가칭 · 청소 생활 앱</div>
          </div>
        </div>
        <button class="icon-button" type="button" id="notificationButton" aria-label="알림">
          <span class="alert-dot" id="alertDot"></span>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M6.5 10.4a5.5 5.5 0 0 1 11 0v3.5l1.7 2.8a1 1 0 0 1-.8 1.5H5.6a1 1 0 0 1-.8-1.5l1.7-2.8v-3.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M9.8 20a2.3 2.3 0 0 0 4.4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <main class="views" id="views">
        <section class="view active" id="view-home" aria-labelledby="homeTitle">
          <div class="home-dashboard">
            <div class="home-greeting">
              <p class="eyebrow">2026년 7월 10일 금요일</p>
              <h1 id="homeTitle">김보송님</h1>
            </div>
            <div class="today-chip" aria-label="오늘 날짜">
              <strong>10</strong>
              <span>금</span>
            </div>
          </div>

          <div class="home-info-grid" id="homeInfoGrid" aria-label="청소 주기 요약"></div>

          <section class="section compact">
            <div class="section-head">
              <h2>최근 완료</h2>
              <button class="text-button" type="button" onclick="openHistorySheet()">전체 보기</button>
            </div>
            <div class="history-strip" id="homeHistoryStrip"></div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>청소 주기</h2>
              <button class="text-button" type="button" id="addCategoryButton">주기 추가</button>
            </div>
            <div class="stack" id="categoryList"></div>
          </section>
        </section>

        <section class="view" id="view-selection" aria-labelledby="selectionTitle">
          <h1 class="sr-only" id="selectionTitle">브랜드 셀렉션</h1>
          <div class="banner-carousel" id="selectionBanners" aria-label="셀렉션 배너"></div>

          <section class="section">
            <div class="section-head">
              <h2>셀렉션 목록</h2>
            </div>
            <div class="filter-row" id="selectionFilters"></div>
            <div class="stack" id="selectionList"></div>
          </section>
        </section>

        <section class="view" id="view-community" aria-labelledby="communityTitle">
          <div class="page-title">
            <p class="eyebrow">커뮤니티</p>
            <h1 id="communityTitle">막히는 청소 문제는 함께 해결해요.</h1>
            <p class="page-copy">실제 사용자의 꿀팁과 답변을 먼저 모아봅니다.</p>
          </div>

          <div class="segmented" role="tablist" aria-label="커뮤니티 분류">
            <button type="button" class="segment active" data-community-tab="tips">꿀팁 공유</button>
            <button type="button" class="segment" data-community-tab="qa">Q&amp;A</button>
          </div>
          <div class="stack" id="communityList"></div>
        </section>

        <section class="view" id="view-community-detail" aria-labelledby="communityDetailTitle">
          <button class="back-button" type="button" id="communityBackButton">
            <span aria-hidden="true">‹</span>
            커뮤니티
          </button>
          <article class="community-detail" id="communityDetail"></article>
        </section>

        <section class="view" id="view-my" aria-labelledby="myTitle">
          <div class="profile-band">
            <div class="avatar" aria-hidden="true">보</div>
            <div>
              <p class="eyebrow">김보송님의 기록</p>
              <h1 id="myTitle">청소발자국</h1>
              <p class="page-copy">내 청소 리듬을 짧게 보고, 자세한 기록은 메뉴에서 확인해요.</p>
            </div>
          </div>

          <section class="stats-grid" id="myStats"></section>

          <section class="section">
            <div class="section-head">
              <h2>최근 12주</h2>
              <span class="muted">주간 완료 기록</span>
            </div>
            <div class="footprint-grid" id="footprintGrid"></div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>메뉴</h2>
            </div>
            <div class="menu-list" id="myMenus"></div>
          </section>
        </section>
      </main>

      <nav class="tabbar" aria-label="하단 네비게이션">
        <button class="tab-button active" type="button" data-view="home" aria-current="page">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-8.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          <span>홈</span>
        </button>
        <button class="tab-button" type="button" data-view="selection">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>셀렉션</span>
        </button>
        <button class="tab-button" type="button" data-view="community">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 7.5h12M6 12h12M6 16.5h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><path d="M4 4.5h16v15H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          <span>커뮤니티</span>
        </button>
        <button class="tab-button" type="button" data-view="my">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8.3" r="3.6" fill="none" stroke="currentColor" stroke-width="2" /><path d="M5 20c1.2-3.4 3.9-5 7-5s5.8 1.6 7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          <span>마이</span>
        </button>
      </nav>

      <div class="sheet-backdrop" id="sheetBackdrop" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <section class="sheet-panel">
          <header class="sheet-header">
            <div>
              <p class="eyebrow" id="sheetStep">상세</p>
              <h2 id="sheetTitle">상세</h2>
              <p class="sheet-sub" id="sheetSub"></p>
            </div>
            <button class="icon-button" type="button" id="sheetClose" aria-label="닫기">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
            </button>
          </header>
          <div class="sheet-body" id="sheetBody"></div>
        </section>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
